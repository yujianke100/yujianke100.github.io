<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 记忆架构 — 培训材料</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Inter','Segoe UI',sans-serif;overflow:hidden;height:100vh}
.stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;padding:3rem 4rem}
.slide.active{opacity:1}
.w{width:100%;max-width:1100px;margin:0 auto}
h1{font-size:clamp(1.8rem,3.2vw,3rem);color:#f1f5f9;font-weight:700;margin-bottom:0.5rem}
h2{font-size:clamp(1.2rem,2vw,1.8rem);color:#f59e0b;font-weight:600;margin-bottom:0.3rem}
h3{font-size:clamp(0.9rem,1.2vw,1.1rem);color:#e2e8f0;font-weight:600;margin-bottom:0.3rem}
p,li{font-size:clamp(0.78rem,1vw,0.9rem);color:#cbd5e1;line-height:1.6}
.sub{color:#94a3b8;font-size:clamp(0.68rem,0.85vw,0.78rem);margin-top:0.2rem}
.ac{color:#f59e0b}
.ac2{color:#38bdf8}
.ac3{color:#34d399}
.card{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:0.7rem 0.9rem}
.card.accent{border-color:rgba(245,158,11,0.3)}
.grid{display:grid;gap:0.5rem}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
ul,ol{padding-left:1.2rem}
li{margin-bottom:0.2rem}
.flow{display:flex;align-items:center;justify-content:center;gap:0.5rem;margin:0.5rem 0}
.flow-item{background:#1e293b;border:1px solid rgba(56,189,248,0.3);border-radius:8px;padding:0.4rem 0.7rem;text-align:center;flex:1}
.flow-item .label{color:#38bdf8;font-size:clamp(0.65rem,0.75vw,0.72rem);font-weight:600}
.flow-item .desc{color:#cbd5e1;font-size:clamp(0.6rem,0.7vw,0.68rem)}
.arrow{color:#64748b;font-size:1.2rem}
.slogan{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:0.6rem 1rem;margin:0.5rem 0;text-align:center}
.slogan p{color:#fbbf24;font-size:clamp(0.75rem,0.9vw,0.85rem)}
.num{font-size:clamp(1.2rem,2vw,1.8rem);font-weight:700;color:#f59e0b}
.progress{position:fixed;top:0;left:0;height:3px;background:#f59e0b;transition:width .3s;z-index:100}
.sn{position:fixed;bottom:0.8rem;right:1.2rem;color:#64748b;font-size:clamp(0.6rem,0.7vw,0.68rem);z-index:100}
.na{position:fixed;top:50%;transform:translateY(-50%);width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid #1e293b;background:#111827;color:#cbd5e1;font-size:1.2rem;cursor:pointer;z-index:100;opacity:0.7;transition:opacity .2s}
.na:hover{opacity:1}
.na:disabled{opacity:0.2;cursor:default}
.pl{left:0.5rem}
.nx{right:0.5rem}
</style>
</head>
<body>
<div class="stage" id="app"></div>
<div class="progress" id="progress"></div>
<div class="sn" id="sn"></div>
<button class="na pl" id="prev">&lsaquo;</button>
<button class="na nx" id="next">&rsaquo;</button>
<script>
const slides = [];

// P1 — 封面
slides.push(() => `<div class="w" style="text-align:center">
  <h1 style="font-size:clamp(2rem,3.8vw,3.5rem);margin-bottom:0.3rem">Agent 记忆架构</h1>
  <p style="color:#38bdf8;font-size:clamp(1rem,1.5vw,1.3rem);margin-bottom:1rem">从笔记 → 记忆 → Agent → 开展工作</p>
  <div class="flow" style="max-width:80%;margin:1.5rem auto">
    <div class="flow-item"><div class="label">📝 Obsidian</div><div class="desc">写笔记文档</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">🧠 知识图谱</div><div class="desc">自动索引</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">🤖 Hermes Agent</div><div class="desc">查询 + 调用</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">⚡ 开展工作</div><div class="desc">研究 · 开发 · 写作</div></div>
  </div>
  <p class="sub">302lab · 2026</p>
</div>`);

// P2 — 最麻烦的是 Agent Memory
slides.push(() => `<div class="w">
  <h2>🤔 Agent Memory 为什么是最麻烦的？</h2>
  <div class="grid g2" style="margin-top:0.8rem">
    <div class="card"><h3>个人 vs 团队</h3><p>研究笔记是私有的，但服务器配置、项目决策是团队的——两者不能混在一起。</p></div>
    <div class="card"><h3>模糊查不到</h3><p>想找"企业传导的研究材料"但不记得文件名——全文搜索不够用。</p></div>
    <div class="card"><h3>新人上手慢</h3><p>每个同学来了都要口口相传"服务器在哪""用什么数据库"。</p></div>
    <div class="card"><h3>权限难管理</h3><p>A 项目的同学不该看到 B 项目的内部知识。</p></div>
  </div>
  <div class="slogan" style="margin-top:0.5rem">
    <p>Hermes 默认的 markdown memory 能满足个人需求，但团队协作需要更系统的方案</p>
  </div>
</div>`);

// P3 — 整体结构图
slides.push(() => `<div class="w">
  <h2>📐 完整结构</h2>
  <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;margin:0.5rem 0">
    <div class="card" style="border-color:rgba(16,185,129,0.4);width:70%;text-align:center">
      <div style="color:#10b981;font-weight:700;font-size:1rem">📝 笔记软件（Obsidian / 任何 markdown 编辑器）</div>
      <p style="color:#94a3b8;font-size:0.75rem">人写文档 · 个人知识库 · Git 同步</p>
    </div>
    <div style="color:#64748b;font-size:1rem">↓ Hermes 自动处理，不需要人动手</div>
    <div class="card" style="border-color:rgba(245,158,11,0.4);width:70%;text-align:center">
      <div style="color:#f59e0b;font-weight:700;font-size:1rem">🧠 三层记忆体系</div>
      <p style="color:#cbd5e1;font-size:0.82rem;margin-top:0.2rem">
        <span style="color:#38bdf8">知识图谱</span>（实体关系索引） · 
        <span style="color:#34d399">Honcho</span>（个人+项目记忆） · 
        <span style="color:#a78bfa">向量索引</span>（文档模糊搜索）
      </p>
    </div>
    <div style="color:#64748b;font-size:1rem">↓ Agent 自动查询</div>
    <div class="card" style="border-color:rgba(56,189,248,0.4);width:70%;text-align:center">
      <div style="color:#38bdf8;font-weight:700;font-size:1rem">🤖 Hermes Agent</div>
      <p style="color:#94a3b8;font-size:0.75rem">按权限搜索 → 找到知识 → 协助工作</p>
    </div>
  </div>
</div>`);

// P4 — 三层记忆详解
slides.push(() => `<div class="w">
  <h2>🧩 三层记忆详解</h2>
  <div class="g3 grid" style="margin-top:0.5rem">
    <div class="card" style="border-color:rgba(245,158,11,0.3)">
      <h3 style="color:#f59e0b">🔗 知识图谱</h3>
      <p>实体关系索引：项目·人员·服务器·数据库·工具·文档</p>
      <p class="sub" style="margin-top:0.2rem">存什么：有哪些服务器、数据库，它们的关联关系</p>
      <p class="sub">谁维护：管理员写种子数据，后续自动扫描文档更新</p>
    </div>
    <div class="card" style="border-color:rgba(56,189,248,0.3)">
      <h3 style="color:#38bdf8">🧠 Honcho</h3>
      <p><b style="color:#cbd5e1">个人记忆</b> — 你的偏好、习惯、对话上下文（只有你能看到）</p>
      <p><b style="color:#cbd5e1">项目记忆</b> — 群聊记录、团队讨论（同项目成员共享）</p>
      <p class="sub" style="margin-top:0.2rem">自动记录，无需手动维护</p>
    </div>
    <div class="card" style="border-color:rgba(139,92,246,0.3)">
      <h3 style="color:#a78bfa">📄 文档索引</h3>
      <p>把所有文档的关键词提取到向量数据库，做模糊搜索</p>
      <p class="sub" style="margin-top:0.2rem">比如搜"企业传导"→ 找到相关文档 → 读内容</p>
      <p class="sub">支持用自己的个人知识库仓库</p>
    </div>
  </div>
</div>`);

// P5 — 知识图谱 + 自动维护
slides.push(() => `<div class="w">
  <h2>🔗 知识图谱（靠 Hermes 自动维护）</h2>
  <div class="g2 grid" style="margin-top:0.5rem">
    <div>
      <h3>包含什么</h3>
      <ul>
        <li><b>项目</b> — 政策大脑、GLake、B站弹幕机器人</li>
        <li><b>服务器</b> — 302lab-hermes、GPU 集群</li>
        <li><b>数据库资产</b> — 裁判文书、政策库、LinkedIn 等</li>
        <li><b>数据仓库</b> — 一仓五库体系</li>
        <li><b>工具</b> — NeuG、Honcho、GraphScope 等</li>
        <li><b>文档</b> — markdown 笔记、设计方案、研究文档</li>
        <li><b>人员</b> — 团队每位成员</li>
      </ul>
    </div>
    <div>
      <h3>怎么维护</h3>
      <ul>
        <li>文档写完后 → <b style="color:#34d399">Hermes 自动扫描</b> → 入图</li>
        <li>新同学来了 → <b style="color:#34d399">管理员一句话</b> → Hermes 加人</li>
        <li>服务器换了 → <b style="color:#34d399">Hermes 更新</b> → 其他人自动知道</li>
        <li>全过程<b style="color:#fbbf24">不需要人动手写代码</b></li>
      </ul>
      <p class="sub" style="margin-top:0.5rem">查询也由 Hermes 自动完成——你只需要问问题</p>
    </div>
  </div>
</div>`);

// P6 — 权限控制
slides.push(() => `<div class="w">
  <h2>🔐 权限控制</h2>
  <div class="g2 grid" style="margin-top:0.5rem">
    <div class="card">
      <h3>每个同学一份配置文件</h3>
      <p>新建账号后，管理员配一份简单配置，定义你能看什么项目的内容</p>
      <p class="sub" style="margin-top:0.2rem">比如：policy-brain 项目成员能看到服务器、数据库信息</p>
      <p class="sub">B站弹幕机器人项目的同学看不到政策大脑的数据</p>
    </div>
    <div class="card">
      <h3>Agent 自动遵守权限</h3>
      <p>查询时 Hermes 自动过滤——无权内容完全不可见</p>
      <p class="sub" style="margin-top:0.2rem">不是"拒绝访问"，是"不存在"</p>
    </div>
  </div>
</div>`);

// P7 — 个人知识库
slides.push(() => `<div class="w">
  <h2>📚 建议：每个人建自己的知识库仓库</h2>
  <div class="g2 grid" style="margin-top:0.5rem">
    <div class="card">
      <h3>放什么</h3>
      <ul>
        <li>服务器配置、SSH 管理</li>
        <li>写作习惯、工具偏好</li>
        <li>个人研究笔记（非团队项目）</li>
        <li>日常用到的一切"不归项目管的"知识</li>
      </ul>
    </div>
    <div class="card">
      <h3>怎么用</h3>
      <ul>
        <li>建一个 GitHub 私有仓库</li>
        <li>Obsidian 打开做 vault</li>
        <li>写的笔记自动同步到 GitHub</li>
        <li>Agent 也能索引到你的个人知识</li>
      </ul>
    </div>
  </div>
  <p class="sub" style="margin-top:0.3rem">团队知识和个人知识不混在一起，各管各的</p>
</div>`);

// P8 — 新同学接入
slides.push(() => `<div class="w">
  <h2>🚀 新同学 5 分钟接入</h2>
  <div class="flow" style="margin-top:0.5rem">
    <div class="flow-item"><div class="label">① 建账号</div><div class="desc">管理员创建 Linux 用户</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">② 配权限</div><div class="desc">定义能看的项目</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">③ 装 Hermes</div><div class="desc">一行命令</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">④ 开始用</div><div class="desc">Agent 自动获取权限</div></div>
  </div>
  <div class="slogan">
    <p>全过程由 Hermes 自动完成，不需要人手动操作</p>
  </div>
</div>`);

// P9 — 整个链条
slides.push(() => `<div class="w" style="text-align:center">
  <h2>⚡ 完整链条</h2>
  <div class="flow" style="max-width:90%;margin:1rem auto">
    <div class="flow-item"><div class="label">📝 你写文档</div><div class="desc">Obsidian / markdown</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">🤖 Hermes 自动</div><div class="desc">扫描 → 索引 → 入图</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">🔍 你问问题</div><div class="desc">Agent 按权限搜索</div></div>
    <div class="arrow">→</div>
    <div class="flow-item"><div class="label">⚡ 得到答案</div><div class="desc">精准 · 带引用</div></div>
  </div>
  <p style="color:#fbbf24;margin-top:0.5rem">你的精力只花在"写笔记"和"问问题"上，中间的全交给 Hermes</p>
  <p class="sub">想自己搭建 Agent 的同学，可以按这个架构参考，也可以用 Hermes 默认的 markdown memory 直接上手</p>
</div>`);

// P10 — 技术栈一览
slides.push(() => `<div class="w">
  <h2>📋 技术栈</h2>
  <table style="margin-top:0.5rem">
    <tr><th>组件</th><th>作用</th><th>方式</th></tr>
    <tr><td>NeuG</td><td>知识图谱存储</td><td>实体关系索引，自动维护</td></tr>
    <tr><td>Honcho</td><td>个人 + 项目记忆</td><td>自动记录偏好、群聊讨论</td></tr>
    <tr><td>向量索引</td><td>文档模糊搜索</td><td>输入关键词 → 找到相关文档</td></tr>
    <tr><td>Obsidian</td><td>写笔记</td><td>markdown + git 同步</td></tr>
    <tr><td>Hermes Agent</td><td>查询 + 调用</td><td>自动处理一切</td></tr>
  </table>
  <p class="sub" style="margin-top:0.3rem">以上全部由 Hermes 自动管理，不需要手动搭建</p>
</div>`);

// P11 — 结语
slides.push(() => `<div class="w" style="text-align:center">
  <h2 style="color:#f1f5f9">🎯 一句话总结</h2>
  <div style="margin:1rem auto;max-width:80%">
    <div class="slogan"><p>你的精力只花在写笔记和问问题上，记忆管理全交给 Hermes</p></div>
    <div class="slogan" style="border-color:rgba(56,189,248,0.3)"><p style="color:#38bdf8">个人知识不进团队，团队知识不泄露给外人</p></div>
    <div class="slogan" style="border-color:rgba(16,185,129,0.3)"><p style="color:#34d399">新同学 5 分钟接入，无需口口相传</p></div>
  </div>
  <p class="sub">想自己搭建 Agent 的同学：Hermes 默认 markdown memory 可直接用，也可参考本架构做扩展</p>
  <p class="sub">GitHub: github.com/ZJGSU-SCIE-302/AI_Worker</p>
</div>`);

// Navigation engine
let cur = 0;
const app = document.getElementById('app');
const pg = document.getElementById('progress');
const sn = document.getElementById('sn');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
function render() {
  app.innerHTML = slides.map((fn, i) => `<div class="slide ${i === cur ? 'active' : ''}">${fn()}</div>`).join('');
  pg.style.width = `${((cur + 1) / slides.length) * 100}%`;
  sn.textContent = `${cur + 1} / ${slides.length}`;
  prev.disabled = cur === 0;
  next.disabled = cur === slides.length - 1;
}
function go(n) { if (n < 0 || n >= slides.length) return; cur = n; render(); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(cur - 1); }
  if (e.key === 'Home') { e.preventDefault(); go(0); }
  if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
});
prev.addEventListener('click', () => go(cur - 1));
next.addEventListener('click', () => go(cur + 1));
let wt;
app.addEventListener('wheel', e => {
  clearTimeout(wt);
  wt = setTimeout(() => { if (e.deltaY > 0) go(cur + 1); else go(cur - 1); }, 200);
}, { passive: true });
let ty = 0;
app.addEventListener('touchstart', e => { ty = e.touches[0].clientY; });
app.addEventListener('touchend', e => {
  const d = ty - e.changedTouches[0].clientY;
  if (Math.abs(d) > 50) { if (d > 0) go(cur + 1); else go(cur - 1); }
});
render();
</script>
</body>
</html>
