<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从文本到本体 — 让机器自己长出一棵类型树</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#e2e8f0}
  .stage{width:100%;height:100vh;position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:3.2vh 4.2vw;opacity:0;transform:scale(0.97) translateY(10px);pointer-events:none;
    transition:opacity 0.45s ease,transform 0.45s ease;overflow-y:auto}
  .slide.active{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
  .slide:nth-child(even){background:linear-gradient(135deg,#111827 0%,#0f172a 100%)}
  .slide:nth-child(odd){background:linear-gradient(135deg,#0a0e1a 0%,#0d1117 100%)}
  .progress{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#06b6d4,#f59e0b);z-index:100;transition:width .3s ease}
  .sn{position:fixed;bottom:14px;right:22px;color:#64748b;font-size:0.82rem;font-weight:600;z-index:100;font-variant-numeric:tabular-nums;user-select:none}
  .na{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
    background:rgba(30,41,59,.6);border:1px solid rgba(45,58,80,.6);color:#94a3b8;font-size:1.4rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:100;transition:all .25s;backdrop-filter:blur(6px);opacity:.65}
  .na:hover{opacity:1;background:rgba(245,158,11,.15);color:#f59e0b;border-color:rgba(245,158,11,.4)}
  .na.pl{left:14px}.na.nx{right:14px}.na:disabled{opacity:0;pointer-events:none}
  .w{max-width:1180px;width:100%;text-align:center}
  .wl{max-width:1180px;width:100%;text-align:left}
  .w h2,.wl h2{font-size:clamp(1.5rem,2.9vw,2.15rem);font-weight:700;margin-bottom:0.8rem;display:inline-block;
    background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .w h3,.wl h3{font-size:clamp(1.1rem,1.5vw,1.28rem);font-weight:600;margin-bottom:0.4rem;color:#f59e0b}
  .w p,.wl p{line-height:1.7;font-size:clamp(0.95rem,1.32vw,1.16rem);color:#cbd5e1}
  .lead{font-size:clamp(1.05rem,1.5vw,1.28rem);color:#e2e8f0;line-height:1.7;margin-bottom:0.7rem}
  .dim{color:#94a3b8}
  .ht{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:800;text-align:center;
    background:linear-gradient(135deg,#06b6d4 0%,#f59e0b 55%,#10b981 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.8rem;line-height:1.18}
  .hs{text-align:center;font-size:clamp(0.95rem,1.4vw,1.15rem);max-width:820px;margin:0 auto;color:#cbd5e1;line-height:1.7}
  .htg{display:inline-block;margin:0.9rem auto 0;padding:0.45rem 1.4rem;border:1px solid rgba(6,182,212,.3);border-radius:10px;
    background:rgba(6,182,212,.06);color:#38bdf8;font-size:clamp(0.78rem,1vw,0.92rem);text-align:center}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;text-align:left}
  .g3{display:grid;grid-template-columns:1fr 1.05fr 1.15fr;gap:0.8rem;text-align:left}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;text-align:left}
  @media(max-width:980px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:linear-gradient(135deg,rgba(30,41,59,.65),rgba(30,41,59,.3));border:1px solid rgba(45,58,80,.5);
    border-radius:10px;padding:0.7rem 0.85rem}
  .card h4{color:#f59e0b;font-size:clamp(0.95rem,1.15vw,1.08rem);margin-bottom:0.3rem;font-weight:600}
  .card p,.card li{font-size:clamp(0.88rem,1.05vw,1rem);color:#cbd5e1;line-height:1.6}
  .card ul{margin-left:1.05rem}
  .card-hl{background:linear-gradient(135deg,rgba(16,185,129,.09),rgba(6,182,212,.06));border:1.5px solid rgba(16,185,129,.35);
    border-radius:10px;padding:0.7rem 0.85rem}
  .shead{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.75rem;flex-wrap:wrap}
  .sbadge{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0a0e1a;font-weight:800;
    font-size:clamp(0.9rem,1.15vw,1.05rem);border-radius:9px;padding:0.22rem 0.62rem;flex-shrink:0}
  .shead h2{margin-bottom:0}
  .strip{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.75rem}
  .pill{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.28);border-radius:8px;
    padding:0.28rem 0.7rem;color:#cbd5e1;font-size:clamp(0.8rem,1vw,0.94rem)}
  .pill b{color:#38bdf8}
  .pill.gr{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.3)}
  .pill.gr b{color:#34d399}
  .pill.am{background:rgba(245,158,11,.09);border-color:rgba(245,158,11,.3)}
  .pill.am b{color:#fbbf24}
  code{background:#0d1117;border:1px solid rgba(45,58,80,.6);border-radius:5px;padding:0.06rem 0.34rem;
    color:#7dd3fc;font-size:0.93em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  table{width:100%;border-collapse:collapse;font-size:clamp(0.8rem,1vw,0.95rem)}
  th,td{padding:0.34rem 0.5rem;border-bottom:1px solid rgba(45,58,80,.55);text-align:left;color:#cbd5e1}
  th{color:#f1f5f9;font-weight:600;background:rgba(30,41,59,.5)}
  td b{color:#34d399}
  .fig{width:100%;max-width:1480px;border-radius:10px;border:1px solid rgba(45,58,80,.5);display:block;margin:0 auto}
  .note{margin-top:0.7rem;font-size:clamp(0.82rem,1vw,0.95rem);color:#94a3b8;line-height:1.6}
</style>
</head>
<body>
<div class="stage" id="app"></div>
<div class="progress" id="pg"></div>
<div class="sn" id="sn"></div>
<button class="na pl" id="prev">‹</button>
<button class="na nx" id="next">›</button>

<script>
const slides = [];

/* ── 1 封面 ── */
slides.push(() => `<div class="w">
  <div class="ht">从文本到本体<br>让机器自己长出一棵类型树</div>
  <div class="hs">读一堆文本 → 自动长出「分类体系（Schema）」，并且每一步都可核验。<br>
  10 个步骤 ｜ 3 个数据集（计算机论文 / 美国法规 / 欧盟法规）｜ 一套预注册的评价口径</div>
  <div class="htg">韩老师指出：<b>学语言 = 学 Schema</b>　｜　两层次归一化：先构建唯一 Schema，让散乱结构映射上去</div>
  <div class="note" style="text-align:center">Agentic Data Lab ｜ 2026-09-20 ｜ 全程脚本可复现（git 可查逐次提交）</div>
</div>`);

/* ── 2 问题定义 ── */
slides.push(() => `<div class="wl">
  <h2>一、问题定义：把「人写 Schema」这件事交给机器</h2>
  <p class="lead">原本由领域专家读完全部文献、手工写出分类体系。我们想让机器做这件事，并且做到三点：
  <b>可复现</b>（同一份语料跑两遍结果一致）、<b>可核验</b>（每一步留下证据）、<b>可迁移</b>（换领域不用重写代码）。</p>
  <div class="g3" style="margin-top:0.5rem">
    <div class="card"><h4>难点 ①　说法太多</h4>
      <p>同一个类东西有上万种写法：计算机论文里出现了 <b>144,623 个</b>不同的类型名，其中三分之一只出现一次。</p></div>
    <div class="card"><h4>难点 ②　互相不一致</h4>
      <p>同一个细类，A 论文说它属于 <code>algorithm</code>，B 论文说属于 <code>method</code>。<b>谁对？需要投票。</b></p></div>
    <div class="card"><h4>难点 ③　没有标准答案</h4>
      <p>领域里不存在现成的"标准本体"，无法直接算准确率。所以必须自己设计<b>证据链 + 人工抽查</b>。</p></div>
  </div>
  <div class="g2" style="margin-top:0.8rem">
    <div class="card-hl"><h4 style="color:#34d399;font-weight:600;margin-bottom:0.3rem">我们要交付的东西（两个）</h4>
      <p>① <b>一棵类型树</b>：细类型 → 中间层 → 顶层类（三个数据集各一棵）；<br>
         ② <b>一套验证口径</b>：结构自检 + 与另一条独立路径对照 + 人工分层抽查。</p></div>
    <div class="card"><h4>先说清产出的是哪一层</h4>
      <p>我们产出<b>概念层级（TBox）</b>——"有哪些类别、类别之间怎么从属"；
      不产出具体实体（ABox）——"张三属于哪个机构"。</p></div>
  </div>
  <div class="note">类比：像给一个刚开张的图书馆编分类法。书是现成的（原文），但"该分几大类、每一类叫什么"要自己长出来。</div>
</div>`);

/* ── 3 总流程 ── */
slides.push(() => `<div class="wl">
  <h2>二、整体流程：十步，分四段</h2>
  <p class="lead">从原文出发，先长出候选类型，再长成一棵树，然后压成可统计的骨架，最后用独立证据 + 人工抽查来验证。</p>
  <div class="g4" style="margin-top:0.55rem">
    <div class="card" style="border-left:3px solid #34d399"><h4>A · 从原文长出候选</h4>
      <p>① 抽取三元组<br>② 类型统计收敛<br>③ 众数投票选上位<br>（含自环修复）</p></div>
    <div class="card" style="border-left:3px solid #38bdf8"><h4>B · 长成一棵树</h4>
      <p>④ 顶层归类（粗坐标）<br>⑤ 建树与结构自检</p></div>
    <div class="card" style="border-left:3px solid #a78bfa"><h4>C · 压成可统计的骨架</h4>
      <p>⑥ star 化（折叠关系维）<br>⑦ 端点聚合 + 阈值切尾</p></div>
    <div class="card" style="border-left:3px solid #f59e0b"><h4>D · 验证</h4>
      <p>⑧ 与骨架对齐（冻结指标）<br>⑨ 两跳验证<br>⑩ 人工分层评测</p></div>
  </div>
  <div class="strip">
    <span class="pill am"><b>第十一步（本轮新增）：增量拼接</b> —— 新文档进来时本体继续生长，不必整棵重建；实测覆盖率 <b>25.9% → 100%</b>、父边与全量一致 <b>92.8%</b>、结构与全量重建等价</span>
  </div>
  <div class="strip">
    <span class="pill">语料：arXiv <b>238.7 万</b> 条</span>
    <span class="pill">CFR <b>13.6 万</b> 条</span>
    <span class="pill">MultiEURLEX <b>382.4 万</b> 条</span>
    <span class="pill gr">合计 <b>634.6 万</b> 条三元组</span>
    <span class="pill am">一键复现：<b>run_star_pipeline.sh</b></span>
  </div>
  <div class="note">接下来的每一页都是同一个模板：<b>为什么做（动机） → 怎么做（步骤） → 真实例子</b>。</div>
</div>`);

/* ── 4 ① 抽取 ── */
slides.push(() => `<div class="wl">
  <div class="shead"><span class="sbadge">步骤 ①</span><h2>抽取：把一篇论文读成结构化的三元组</h2></div>
  <div class="g3">
    <div class="card"><h4>动机</h4><p>"什么东西和什么东西有关系"都藏在句子里。机器要先把它们变成一条条结构化记录，后面才谈得上统计。</p></div>
    <div class="card"><h4>步骤</h4><p>让模型读正文，按固定格式输出：<br>
      <b>主体</b>（最细类型 → 上位类型）—<b>关系</b>→ <b>客体</b>（类型 → 上位）<br>
      并记下这条来自哪篇文档。<br><span class="dim">特别注意：不给类型表 —— 类型由语料自己长出来。</span></p></div>
    <div class="card"><h4>例子（真实，来自论文 2403.10051）</h4>
      <p><code>pim-friendly graph partitioning algorithm</code><br>
      <span class="dim">[optimization_algorithm → algorithm]</span><br>
      —achieve→ <code>load balance</code><br>
      <span class="dim">[performance_metric → metric]</span></p></div>
  </div>
  <div class="strip">
    <span class="pill">一篇论文可抽出 <b>400 条</b></span>
    <span class="pill">arXiv 单域 <b>238.7 万条</b></span>
    <span class="pill gr">三域合计 <b>634.6 万条</b></span>
  </div>
  <div class="note">为什么每条都带两个类型字段？因为"最细类型"和"上位类型"是一次抽取同时产出的 —— 这是整条流水线的地基。</div>
</div>`);

/* ── 5 ② 类型收敛 ── */
slides.push(() => `<div class="wl">
  <div class="shead"><span class="sbadge">步骤 ②</span><h2>类型统计收敛：14 万个说法 → 3.4 万个概念</h2></div>
  <div class="g3">
    <div class="card"><h4>动机</h4><p>开放输出的代价是"同一个东西一万种叫法"，还有大量只出现一次的噪声。先要分清<b>概念</b>和<b>个人说法 / 笔误</b>。</p></div>
    <div class="card"><h4>步骤</h4><p>统计每个类型串的<b>出现次数</b>和<b>出现在多少篇不同文档</b>里；<br>
      只保留"至少在 <b>3 篇不同文档</b>里被用过"的类型。<br>
      <span class="dim">像词频统计：只出现一次的多半是个案，反复出现的是真概念。</span></p></div>
    <div class="card"><h4>例子（arXiv 真实统计）</h4>
      <p>高频：<code>model_parameter</code> 153,391 次；<code>neural_network_model</code> 119,949 次<br>
      长尾：只出现 <b>1 次</b>的 <b>47,744 个（33.0%）</b>；出现 ≤3 次的 86,966 个（60.1%）</p></div>
  </div>
  <div class="strip">
    <span class="pill">14.46 万个类型串</span>
    <span class="pill gr">收敛后进入建树：<b>34,152 个</b></span>
    <span class="pill am">砍掉的部分 = 三分之一的"一次性说法"</span>
  </div>
  <div class="note">这一步是全流程里最"便宜"也最有效的一招：它同时压掉了噪声和跨文档不一致（只被一篇文档用过的说法不可信）。</div>
</div>`);

/* ── 6 ③ 众数投票 + 自环 ── */
slides.push(() => `<div class="wl">
  <div class="shead"><span class="sbadge">步骤 ③</span><h2>众数投票：给每个细类型选一个唯一的父</h2></div>
  <div class="g3">
    <div class="card"><h4>动机</h4><p>同一个细类型，不同论文给的上位不一样（<code>optimization_algorithm</code> 有的写成 algorithm 的种、有的写成 method 的种）。必须选一个，否则树建不起来。</p></div>
    <div class="card"><h4>步骤</h4><p>统计该类型所有上位说法，取<b>众数</b>；<br>
      <b>投票时排除自己</b>（修"自己挂自己"这种逻辑错误）；<br>
      没有别的候选就标记"待定"，<b>不回退自环</b>。</p></div>
    <div class="card"><h4>例子（arXiv 真实票型）</h4>
      <p><code>neural_network_model → model</code>　<b>99.8%</b><br>
      <code>optimization_algorithm → algorithm</code>　<b>82.1%</b>（次选 method 17.6%）<br>
      <code>ablation_study → study</code>　<b>62.4%</b><br>
      修自环：<code>identifier</code> 众数是自己 → 改挂 <code>attribute</code>（共 36 个）</p></div>
  </div>
  <div class="strip">
    <span class="pill">多候选占比 <b>47–56%</b>（看着很乱）</span>
    <span class="pill gr">众数占比<b>中位 0.94–1.00</b>（其实不糊涂）</span>
    <span class="pill am">真正模糊（&lt;0.5）只占 <b>4.8–8.5%</b></span>
  </div>
  <div class="note">诚实标注：那 36 个自环修复后的父是"次选"，占比只有 14–28%，是全树最弱的一批边 —— 已单独记录，抽检时重点看。</div>
</div>`);

/* ── 7 ④ 顶层归类 ── */
slides.push(() => `<div class="wl">
  <div class="shead"><span class="sbadge">步骤 ④</span><h2>顶层归类：给树一个"粗坐标"，但不写死</h2></div>
  <div class="g3">
    <div class="card"><h4>动机</h4><p>1,051 个中间层类型还是太散，跨文档没法聚合，需要一层粗类。<br>
      <b>但不能写死</b>：用法律领域的 22 类去套计算机论文，会把 <code>theoretical_guarantee</code> 误判成"权利"。</p></div>
    <div class="card"><h4>步骤</h4><p>① 类表放在<b>文件里</b>、可增长；<br>
      ② 对"放不下的名字"<b>开放提案</b>（可提新类，但禁用 concept / entity / category 这类"什么都能装"的词）；<br>
      ③ 护栏：成员数 ≥3、与已有类名不重复；<br>
      ④ 末尾<b>人工终审</b>（护栏拦不住"万能词"）。</p></div>
    <div class="card"><h4>例子（三个域各自长出来的）</h4>
      <p>arXiv：<code>structure</code>（82 个名字）、<code>field</code>、<code>formula</code><br>
      MultiEURLEX：<code>market_domain</code>、<code>regulatory_instrument</code><br>
      CFR：一个都不用加（基础类刚好够用）</p></div>
  </div>
  <div class="strip">
    <span class="pill">兜底率 arXiv <b>19.0% → 0.86%</b></span>
    <span class="pill">CFR <b>89.3% → 0.28%</b></span>
    <span class="pill">MultiEURLEX <b>90.0% → 0.15%</b></span>
  </div>
  <div class="note">诚实标注：抽检被强行归类的名字，合理率约 <b>80% / 70%</b> —— 顶层类是"分区坐标"，作用是让统计能聚合，<b>不代表分类准确率</b>。</div>
</div>`);

/* ── 8 ⑤ 建树 ── */
slides.push(() => `<div class="wl">
  <div class="shead"><span class="sbadge">步骤 ⑤</span><h2>建树：把三层拼成一棵"干净的树"</h2></div>
  <div class="g3">
    <div class="card"><h4>动机</h4><p>三层散着没法用。要拼成一棵树，并满足：每个类型<b>有且只有一个父</b>、从根能走到任何节点、<b>没有环</b>。</p></div>
    <div class="card"><h4>步骤</h4><p>细类型 → 挂到投票选出的中间层；<br>
      中间层 → 挂到顶层类；<br>
      顶层类 → 挂到唯一根。<br>
      <span class="dim">特殊处理：同名冲突、"既当中间层又当顶层类"的节点。</span></p></div>
    <div class="card"><h4>例子（真实路径）</h4>
      <p><code>optimization_algorithm → algorithm → method → root</code><br>
      <code>data_structure → structure → root</code><br>

/* ── 引擎 ── */
const app = document.getElementById('app'), pg = document.getElementById('pg'),
      sn = document.getElementById('sn'), prev = document.getElementById('prev'),
      next = document.getElementById('next');
let cur = 0;
function render(){
  app.innerHTML = slides.map((fn,i) => '<div class="slide'+(i===cur?' active':'')+'">'+fn()+'</div>').join('');
  pg.style.width = ((cur+1)/slides.length*100)+'%';
  sn.textContent = (cur+1)+' / '+slides.length;
  prev.disabled = cur===0; next.disabled = cur===slides.length-1;
}
function go(n){ if(n<0||n>=slides.length) return; cur=n; render();
  if(location.hash!=='#'+(n+1)) history.replaceState(null,'','#'+(n+1)); }
function fromHash(){ const n=parseInt((location.hash||'').replace('#',''),10);
  if(!isNaN(n)&&n>=1&&n<=slides.length){ cur=n-1; render(); } }
window.addEventListener('hashchange', fromHash);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(cur-1);}
  if(e.key==='Home'){e.preventDefault();go(0);}
  if(e.key==='End'){e.preventDefault();go(slides.length-1);}
});
prev.addEventListener('click',()=>go(cur-1));
next.addEventListener('click',()=>go(cur+1));
let wt; app.addEventListener('wheel',e=>{clearTimeout(wt);wt=setTimeout(()=>{e.deltaY>0?go(cur+1):go(cur-1);},200);},{passive:true});
let ty=0; app.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;});
app.addEventListener('touchend',e=>{const d=ty-e.changedTouches[0].clientY; if(Math.abs(d)>50){d>0?go(cur+1):go(cur-1);}});
render(); fromHash();
</script>
</body>
