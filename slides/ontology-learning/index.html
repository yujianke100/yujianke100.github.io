<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>类型级本体构建 — 进度汇报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#e2e8f0}

  .stage{width:100%;height:100vh;position:relative;overflow:hidden}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:3.5vh 4.5vw;
    opacity:0;transform:scale(0.96) translateY(12px);
    pointer-events:none;
    transition:opacity 0.5s ease,transform 0.5s ease;
    overflow-y:auto;
  }
  .slide.active{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
  .slide:nth-child(even){background:linear-gradient(135deg,#111827 0%,#0f172a 100%)}
  .slide:nth-child(odd){background:linear-gradient(135deg,#0a0e1a 0%,#0d1117 100%)}

  .progress{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#06b6d4,#f59e0b);z-index:100;transition:width 0.3s ease}
  .sn{position:fixed;bottom:16px;right:24px;color:#64748b;font-size:0.82rem;font-weight:600;z-index:100;font-variant-numeric:tabular-nums;user-select:none}
  .na{
    position:fixed;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    background:rgba(30,41,59,0.6);border:1px solid rgba(45,58,80,0.6);
    color:#94a3b8;font-size:1.4rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:100;
    transition:all 0.25s;backdrop-filter:blur(6px);opacity:0.7;
  }
  .na:hover{opacity:1;background:rgba(245,158,11,0.15);color:#f59e0b;border-color:rgba(245,158,11,0.4)}
  .na.pl{left:16px}.na.nx{right:16px}
  .na:disabled{opacity:0;pointer-events:none}

  .w{max-width:1180px;width:100%;text-align:center}
  .wl{max-width:1180px;width:100%;text-align:left}

  .w h2,.wl h2{
    font-size:clamp(1.5rem,2.9vw,2.15rem);font-weight:700;margin-bottom:0.9rem;
    display:inline-block;
    background:linear-gradient(135deg,#f59e0b,#fbbf24);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .w h3,.wl h3{font-size:clamp(1.1rem,1.5vw,1.28rem);font-weight:600;margin-bottom:0.4rem;color:#f59e0b}
  .w p,.wl p{line-height:1.7;font-size:clamp(0.95rem,1.32vw,1.16rem);color:#cbd5e1}
  .lead{font-size:clamp(1.05rem,1.5vw,1.28rem);color:#e2e8f0;line-height:1.7;margin-bottom:0.7rem}

  .ht{
    font-size:clamp(2.1rem,5vw,3.6rem);font-weight:800;text-align:center;
    background:linear-gradient(135deg,#06b6d4 0%,#f59e0b 55%,#10b981 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:0.9rem;line-height:1.18;
  }
  .hs{text-align:center;font-size:clamp(0.9rem,1.35vw,1.1rem);max-width:760px;margin:0 auto;color:#cbd5e1;line-height:1.7}
  .htg{display:inline-block;margin:0.85rem auto 0;padding:0.45rem 1.5rem;border:1px solid rgba(6,182,212,0.3);border-radius:10px;background:rgba(6,182,212,0.06);color:#38bdf8;font-size:clamp(0.78rem,1vw,0.9rem);text-align:center}

  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;text-align:left}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.7rem;text-align:left}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;text-align:left}
  @media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

  .card{
    background:linear-gradient(135deg,rgba(30,41,59,0.65),rgba(30,41,59,0.3));
    border:1px solid rgba(45,58,80,0.5);border-radius:10px;padding:0.75rem 0.85rem;
    transition:border-color 0.2s,transform 0.2s;
  }
  .card:hover{border-color:rgba(245,158,11,0.3);transform:translateY(-1px)}
  .card h4{color:#f59e0b;font-size:clamp(0.95rem,1.15vw,1.08rem);margin-bottom:0.3rem;font-weight:600}
  .card p{font-size:clamp(0.88rem,1.05vw,1rem);color:#cbd5e1;line-height:1.55}

  .card-hl{
    background:linear-gradient(135deg,rgba(16,185,129,0.09),rgba(6,182,212,0.06));
    border:1.5px solid rgba(16,185,129,0.35);border-radius:12px;padding:0.9rem 1.05rem;
    position:relative;overflow:hidden;text-align:left;
  }
  .card-hl::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#10b981,#06b6d4);border-radius:2px}
  .card-hl h4{color:#10b981;font-size:clamp(1rem,1.2vw,1.15rem);margin-bottom:0.35rem;font-weight:600}
  .card-hl p{font-size:clamp(0.88rem,1.05vw,1rem);color:#cbd5e1;line-height:1.6}
  .card-hl strong{color:#f1f5f9}

  .flow-row{display:flex;align-items:center;justify-content:center;gap:0.35rem;flex-wrap:wrap;margin:0.35rem 0}
  .flow-box{padding:0.5rem 0.75rem;border-radius:7px;border:1.5px solid;font-size:clamp(0.8rem,0.95vw,0.92rem);font-weight:600;text-align:center;min-width:60px}
  .flow-arrow{color:#64748b;font-size:1rem}
  .f-green{border-color:rgba(16,185,129,0.45);color:#34d399;background:rgba(16,185,129,0.07)}
  .f-blue{border-color:rgba(56,189,248,0.45);color:#38bdf8;background:rgba(56,189,248,0.07)}
  .f-purple{border-color:rgba(167,139,250,0.45);color:#a78bfa;background:rgba(167,139,250,0.07)}
  .f-amber{border-color:rgba(245,158,11,0.45);color:#fbbf24;background:rgba(245,158,11,0.07)}

  .pb{background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.28);border-radius:10px;padding:0.7rem 0.85rem;text-align:left}
  .pb .l{color:#f87171;font-weight:600;font-size:clamp(0.86rem,1vw,0.96rem);margin-bottom:0.15rem}
  .pb p{font-size:clamp(0.86rem,1.02vw,0.98rem);color:#cbd5e1;line-height:1.55}
  .pg{background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.28);border-radius:10px;padding:0.7rem 0.85rem;text-align:left}
  .pg .l{color:#34d399;font-weight:600;font-size:clamp(0.86rem,1vw,0.96rem);margin-bottom:0.15rem}
  .pg p{font-size:clamp(0.86rem,1.02vw,0.98rem);color:#cbd5e1;line-height:1.55}
  .py{background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.28);border-radius:10px;padding:0.7rem 0.85rem;text-align:left}
  .py .l{color:#fbbf24;font-weight:600;font-size:clamp(0.86rem,1vw,0.96rem);margin-bottom:0.15rem}
  .py p{font-size:clamp(0.86rem,1.02vw,0.98rem);color:#cbd5e1;line-height:1.55}
  .pc{background:rgba(167,139,250,0.07);border:1px solid rgba(167,139,250,0.28);border-radius:10px;padding:0.7rem 0.85rem;text-align:left}
  .pc .l{color:#a78bfa;font-weight:600;font-size:clamp(0.86rem,1vw,0.96rem);margin-bottom:0.15rem}
  .pc p{font-size:clamp(0.86rem,1.02vw,0.98rem);color:#cbd5e1;line-height:1.55}

  .tag{display:inline-block;padding:0.1rem 0.42rem;border-radius:5px;font-size:clamp(0.66rem,0.76vw,0.73rem);font-weight:600}
  .tg{background:rgba(245,158,11,0.14);color:#fbbf24}
  .tt{background:rgba(6,182,212,0.14);color:#38bdf8}
  .tgg{background:rgba(16,185,129,0.14);color:#34d399}
  .tr{background:rgba(239,68,68,0.14);color:#f87171}
  .tp{background:rgba(167,139,250,0.14);color:#a78bfa}

  .q{
    border-left:3px solid #f59e0b;padding:0.6rem 0.95rem;margin:0.55rem auto 0;max-width:900px;
    background:rgba(245,158,11,0.05);border-radius:0 8px 8px 0;
    font-size:clamp(0.88rem,1.05vw,1rem);color:#cbd5e1;line-height:1.65;text-align:left
  }
  .q strong{color:#f1f5f9}
  .q code{color:#fbbf24;font-family:'SF Mono','Consolas',monospace;font-size:0.94em}

  .fig{width:100%;max-width:1440px;border-radius:10px;border:1px solid rgba(45,58,80,0.6);background:#0d1521;display:block;margin:0.1rem auto}
  .tw{overflow-x:auto;margin:0.5rem auto;max-width:940px;width:100%}
  table{width:100%;border-collapse:collapse;font-size:clamp(0.8rem,1vw,0.95rem)}
  th,td{padding:0.38rem 0.5rem;text-align:center;border-bottom:1px solid rgba(45,58,80,0.45)}
  th{background:rgba(30,41,59,0.7);color:#fbbf24;font-weight:600}
  td{color:#cbd5e1}td b{color:#f1f5f9}
  .up{color:#34d399;font-weight:700}.dn{color:#f87171;font-weight:700}

  .num{font-size:clamp(1.3rem,2.4vw,1.95rem);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .tc{text-align:center!important}
  .mb1{margin-bottom:0.6rem}.mt1{margin-top:0.6rem}
  .dim{color:#94a3b8}
  .sub{font-size:clamp(0.78rem,0.95vw,0.88rem);color:#94a3b8;line-height:1.5}
  ul{margin:0.25rem 0 0.25rem 1.05rem}li{line-height:1.6;color:#cbd5e1;font-size:clamp(0.86rem,1.02vw,0.98rem)}
  strong{color:#f1f5f9}
  .bounce{display:inline-block;animation:b2 2s infinite}@keyframes b2{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div class="stage" id="app"></div>
<div class="progress" id="progress"></div>
<div class="sn" id="sn"></div>
<button class="na pl" id="prev">&lsaquo;</button>
<button class="na nx" id="next">&rsaquo;</button>

<script>
const slides = [];

// === 1 封面 ===
slides.push(() => `<div class="w" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1">
  <div class="ht">类型级本体构建</div>
  <p class="hs" style="font-size:clamp(1rem,1.7vw,1.4rem);color:#e2e8f0">从大规模文本中学习 Schema：LLM 抽取 → 统计收敛 → 增量拼接</p>
  <p class="hs" style="margin-top:0.6rem;color:#94a3b8">阶段进度汇报 · 三域实证（法律 / 欧盟法 / 计算机科学）</p>
  <div class="htg">类型级（TBox）· 统计收敛作归纳偏置 · 单数据集域内自适应</div>
  <p style="margin-top:3vh;color:#64748b;font-size:0.78rem"><span class="bounce">&darr;</span> 按 &rarr; 键浏览</p>
</div>`);

// === 2 一句话：在研究什么 ===
slides.push(() => `<div class="wl" style="display:flex;flex-direction:column;justify-content:center;flex:1">
  <div class="w tc"><h2>这项研究在解决什么问题</h2></div>
  <p class="lead tc">把"读文本 → 写本体"这件本该由人做的 Schema 设计工作，交给机器做，并且做得可验证</p>
  <div class="g2">
    <div class="pc"><div class="l">🎯 目标</div>
      <p>从大规模领域文本中<b>自动学习类型级本体</b>（TBox：类型 + 上下位关系），而不是只做逐实例的 ABox 填充。<br>
         本体是一套<b>Schema</b>——它可以反过来约束、校验、复用在下游的图构建与推理上。</p>
    </div>
    <div class="pb"><div class="l">❗ 为什么难</div>
      <p>① 抽取本身有噪声，且每次运行结果都在变；<br>
         ② 同一概念在文本里有多种叫法（<b>异词同义</b>），越高频越碎；<br>
         ③ 层级关系在文本里是<b>隐含</b>的，不能靠名字相似度猜；<br>
         ④ 缺少该规模下的人工标注真值，评价口径本身要设计。</p>
    </div>
  </div>
  <div class="q"><strong>核心思路</strong>：单个文档里"谁是上位类型"不可靠，但<b>跨文档的统计频次</b>可靠。<br>
    把类型级统计分布当作<b>归纳偏置</b>：频次决定"谁值得进本体、谁和谁能合并、谁是谁的上位"，LLM 只负责它擅长的语义判断。</div>
</div>`);

// === 3 方法主线 ===
slides.push(() => `<div class="wl" style="display:flex;flex-direction:column;justify-content:center;flex:1">
  <div class="w tc"><h2>方法主线：三阶段流水线</h2></div>
  <p class="lead tc">每一阶段都有明确的机器可检验产物</p>
  <div class="flow-row mb1">
    <div class="flow-box f-green" style="min-width:150px">① LLM 抽取<br><span class="sub">类型 / 关系 / 三层</span></div>
    <span class="flow-arrow">&rarr;</span>
    <div class="flow-box f-blue" style="min-width:150px">② 类型级统计收敛<br><span class="sub">频次即归纳偏置</span></div>
    <span class="flow-arrow">&rarr;</span>
    <div class="flow-box f-purple" style="min-width:150px">③ 增量拼接<br><span class="sub">ConceptCard + 局部操作</span></div>
    <span class="flow-arrow">&rarr;</span>
    <div class="flow-box f-amber" style="min-width:130px">本体树<br><span class="sub">类型 + 上下位</span></div>
  </div>
  <div class="g2">
    <div class="card"><h4>设计 A · 三层类型作"坐标"</h4>
      <p>抽取同时产出 <b>direct</b>（最细，作叶子）/ <b>parent</b>（中层，作聚合与匹配层）/ <b>grandparent</b>（粗类，作分区坐标）。<br>
         <span class="dim">实测：L1 不可匹配（巨分量仅 61–92%），L2 恒 100% 连通 → 聚合层必须放在 L2。</span></p>
    </div>
    <div class="card"><h4>设计 B · star 结构（关系通配符化）</h4>
      <p>三元组把关系换成通配符，碎片变成<b>类型对</b> <code>(A) &mdash;*&rarr; (B)</code>，权重由抽取统计量决定。<br>
         <span class="dim">让"关系层噪声"不再污染结构层，同时保留统计信号。</span></p>
    </div>
  </div>
  <div class="q"><strong>老师口径</strong>：不做全泛化 OL，<b>限定单个数据集</b> —— 因此顶层设计走"域内自适应"，跨域只做可比的锚点层。</div>
</div>`);

// === 4 数据与规模 ===
slides.push(() => `<div class="wl" style="display:flex;flex-direction:column;justify-content:center;flex:1">
  <div class="w tc"><h2>实验规模：三个域、两套口径</h2></div>
  <p class="lead tc">三域语料规模从数千篇到近万篇，覆盖法律、多语法律、学术论文三类语体</p>
  <div class="tw">
  <table>
    <tr><th>域</th><th>语料规模（文档 / 三元组）</th><th>可用外部本体（TBox）</th><th>本体树节点</th></tr>
    <tr><td><b>CFR</b><span class="dim"> 美国联邦法规</span></td><td>6,190 / 97,118</td><td>LKIF-Core（203 节点）</td><td><b>3,231</b></td></tr>
    <tr><td><b>MultiEURLEX</b><span class="dim"> 欧盟法（多语）</span></td><td>8,262 / 217,645</td><td>EuroVoc（7,402 标签）</td><td><b>4,381</b></td></tr>
    <tr><td><b>arXiv</b><span class="dim"> 计算机科学论文</span></td><td>2,173 / 175,573</td><td>ACM CCS（13 类）</td><td><b>495</b></td></tr>
  </table>
  </div>
  <div class="g3">
    <div class="pg"><div class="l">✅ 有 TBox 真值</div><p>4 套标准本体可用于<b>类型级</b>对齐（LKIF / EuroVoc / US Law / ACM CCS）。</p></div>
    <div class="pb"><div class="l">⚠️ 无 ABox 标注</div><p>没有该语料规模下的人工实例标注 → 评价主要靠<b>结构指标 + 类型级对齐 + 人工抽检</b>。</p></div>
    <div class="py"><div class="l">📌 口径说明</div><p>ACM CCS 是<b>主题分类</b>而非类型本体，<b>不可</b>直接作为质量判据 —— 已在报告中显式标注。</p></div>
  </div>
</div>`);

// === 5 抽取层 ===
slides.push(() => `<div class="wl" style="display:flex;flex-direction:column;justify-content:center;flex:1">
  <div class="w tc"><h2>阶段进展 ①：抽取层已定稿</h2></div>
  <p class="lead tc">经过版本迭代，三层抽取 prompt 收敛到可用版本，并用两套模型交叉验证</p>
  <div class="g3 mb1">
    <div class="card"><h4>类型层 · 定稿</h4><p class="tc"><span class="tag tgg">v8c</span></p>
      <p>27B 本地模型已达更大云端模型的<b>收敛水平</b>（类型数 191 ≈ 194）。<br><span class="dim">内容准确率 99.6%</span></p></div>
    <div class="card"><h4>关系层 · 定稿</h4><p class="tc"><span class="tag tgg">v9.1</span></p>
      <p>句子锚定率 72% 完整 / 25% 部分 / 3% 无锚点；三元组约 20.0 条/篇。<br><span class="dim">短板：schema 缺 value / qualifier 槽位</span></p></div>
    <div class="card"><h4>三层类型 · 定稿</h4><p class="tc"><span class="tag tgg">v13.3</span></p>
      <p>22 类粗类 + concept 兜底，兜底占比 <b>4.1–6.4%</b>（达标 &lt;5% 量级）。<br><span class="dim">direct / parent / grandparent 一次产出</span></p></div>
  </div>
  <div class="g2">
    <div class="pg"><div class="l">📊 稳定性（关键结论）</div>
      <p>重复抽取的表达层波动大（<b>轮间三元组 Jaccard 0.59</b>，逐篇 0.11–1.00），但<b>概念层 1–2 轮就饱和</b>——重复 5–10 次不再产生新类型。<br>
         → 结论：<b>报告必须取 3 轮以上的收敛值</b>，单轮结果不能当结论。</p></div>
    <div class="pg"><div class="l">✅ 抽取质量</div>
      <p>逐条人工/自动判定：<b>明显错误率 &lt; 1%</b>；语义段按频次加权约 2–4%。<br>
         两个后端抽出的三元组集合差异很大（Jaccard 0–0.45），<b>但各自抽出的都基本正确</b> —— 属于互补而非冲突。</p></div>
  </div>
</div>`);

// === 6 star 结构 ===
slides.push(() => `<div class="wl" style="display:flex;flex-direction:column;justify-content:center;flex:1">
  <div class="w tc"><h2>阶段进展 ②：star 结构的效果（可量化收益）</h2></div>
  <p class="lead tc">关系通配符化把"关系层噪声"从结构层剥离，同时显著改善了长尾与复现性</p>
  <div class="g4 mb1">
    <div class="card tc"><div class="num" style="color:#34d399">3.6&ndash;7.3&times;</div><p class="sub">碎片压缩倍数<br>（同义/近义碎片被归并）</p></div>
    <div class="card tc"><div class="num" style="color:#38bdf8">60&ndash;64%<br>&darr; 41&ndash;44%</div><p class="sub">长尾碎片占比<br>（长尾显著收敛）</p></div>
    <div class="card tc"><div class="num" style="color:#fbbf24">+25&ndash;40%</div><p class="sub">劈半复现性<br>（数据切一半，结论复现率）</p></div>
    <div class="card tc"><div class="num" style="color:#a78bfa">不变</div><p class="sub">节点数与覆盖率<br>（不是靠删数据换来的）</p></div>

// === 引擎 ===
let cur = 0;
const app = document.getElementById('app');
const pg = document.getElementById('progress');
const sn = document.getElementById('sn');
const prev = document.getElementById('prev');
const next = document.getElementById('next');

function render() {
  app.innerHTML = slides.map((fn, i) =>
    '<div class="slide ' + (i === cur ? 'active' : '') + '">' + fn() + '</div>'
  ).join('');
  pg.style.width = ((cur + 1) / slides.length * 100) + '%';
  sn.textContent = (cur + 1) + ' / ' + slides.length;
  prev.disabled = cur === 0;
  next.disabled = cur === slides.length - 1;
}
function go(n) { if (n < 0 || n >= slides.length) return; cur = n; render(); if (location.hash !== '#' + (n + 1)) history.replaceState(null, '', '#' + (n + 1)); }
function fromHash() {
  const n = parseInt((location.hash || '').replace('#', ''), 10);
  if (!isNaN(n) && n >= 1 && n <= slides.length) { cur = n - 1; render(); }
}
window.addEventListener('hashchange', fromHash);

// 支持 #页码 直达（打印/截图/汇报跳页）

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(cur - 1); }
  if (e.key === 'Home') { e.preventDefault(); go(0); }
  if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
});
prev.addEventListener('click', () => go(cur - 1));
next.addEventListener('click', () => go(cur + 1));
let wt;
app.addEventListener('wheel', e => {
  clearTimeout(wt);
  wt = setTimeout(() => { if (e.deltaY > 0) go(cur + 1); else go(cur - 1); }, 200);
}, { passive: true });
let ty = 0;
app.addEventListener('touchstart', e => { ty = e.touches[0].clientY; });
app.addEventListener('touchend', e => {
  const d = ty - e.changedTouches[0].clientY;
  if (Math.abs(d) > 50) { if (d > 0) go(cur + 1); else go(cur - 1); }
});
render();
fromHash();
</script>
