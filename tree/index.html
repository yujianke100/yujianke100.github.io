<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>类型本体树浏览器 · Ontology Type Tree Explorer</title>
<style>
/* ==================== 主题：白底高可视性 ==================== */
:root{
  --bg:#ffffff; --stage:#fbfcfe; --fg:#0f172a; --fg2:#334155; --fg3:#64748b;
  --bd:#e2e8f0; --hover:#f1f5f9; --accent:#1d4ed8; --accent-bg:#eff6ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); overflow:hidden;
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}

/* ==================== 顶栏 ==================== */
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;
  background:#fff;border-bottom:1px solid var(--bd);z-index:30}
.brand{font-size:14px;font-weight:700;letter-spacing:.2px;white-space:nowrap;color:#0b1220}
.brand .sub{font-size:11px;color:var(--fg3);font-weight:400;margin-left:6px}
.group{display:flex;align-items:center;gap:6px}
.group .glab{font-size:11.5px;color:var(--fg3);margin-right:2px;white-space:nowrap}
button,.btn{background:#fff;color:var(--fg2);border:1px solid var(--bd);border-radius:7px;
  padding:4px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.12s}
button:hover{background:var(--hover);color:var(--fg);border-color:#94a3b8}
button.on{background:var(--accent-bg);color:#12307a;border-color:#93b4f5;font-weight:600;
  box-shadow:0 0 0 2px rgba(29,78,216,.10)}
#searchwrap{position:relative;flex:0 0 250px;margin-left:auto}
#q{width:100%;background:#fff;border:1px solid var(--bd);border-radius:7px;color:var(--fg);
  padding:5px 9px;font-size:12.5px;font-family:inherit;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
#results{position:absolute;top:33px;left:0;right:0;max-height:340px;overflow:auto;z-index:60;
  background:#fff;border:1px solid var(--bd);border-radius:9px;box-shadow:0 14px 36px rgba(15,23,42,.16)}
#results .rh{padding:5px 9px;font-size:11px;color:var(--fg3);border-bottom:1px solid var(--bd);
  position:sticky;top:0;background:#fff}
#results .ritem{padding:5px 9px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;
  font-size:12.5px;border-bottom:1px solid #f1f5f9}
#results .ritem:hover,#results .ritem.active{background:#eff6ff}
#results .ritem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
#results .ritem .dp{color:var(--fg3);font-size:11px;white-space:nowrap}
.zoomgroup{gap:4px}
.zoomgroup .zl{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fg2);font-size:12.5px}
.hidden{display:none!important}

/* ==================== 工具栏 ==================== */
#toolrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:7px 14px;
  background:#f8fafc;border-bottom:1px solid var(--bd);z-index:20}
#toolrow .hint{font-size:11.5px;color:var(--fg3);margin-left:4px}
#toolrow .hint b{color:var(--fg2);font-weight:600}

/* ==================== 画布 ==================== */
#stage{position:relative;overflow:hidden;background:var(--stage);
  background-image:radial-gradient(#e8edf5 1px,transparent 1px);background-size:22px 22px}
#tree{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#tree.drag{cursor:grabbing}
#levels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#levels .lv{position:absolute;left:0;right:0;height:0;border-top:1px dashed #e2e8f0}
#levels .lvl{position:absolute;left:6px;font-size:11px;color:#475569;background:rgba(255,255,255,.9);
  padding:1px 6px;border-radius:5px;white-space:nowrap;border:1px solid #eef2f7}
#levels .lvl b{color:#0f172a}

/* ==================== 详情面板 ==================== */
#detail{position:absolute;top:10px;right:10px;width:332px;max-height:calc(100% - 20px);overflow:auto;
  background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.14);
  padding:11px 12px;z-index:25}
#detail .dt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:700;
  color:#0b1220;word-break:break-all;line-height:1.35}
#detail .depthbadge{display:inline-block;margin-top:6px;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--accent-bg);color:#12307a;font-weight:600}
#detail .sec{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}
#detail .lab{font-size:11px;color:var(--fg3);margin-bottom:4px}
#detail .path{font-size:12px;line-height:1.9}
#detail .pa{font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer;color:#1d4ed8;
  background:#f8fafc;border:1px solid var(--bd);border-radius:5px;padding:1px 5px;display:inline-block;margin:0 1px 3px}
#detail .pa:hover{background:#eff6ff}
#detail .pa.cur{background:#12307a;color:#fff;border-color:#12307a}
#detail .kv{font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:600}
#detail .row{font-size:12.5px;color:var(--fg2);margin:3px 0}
#detail .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#detail .xhint{font-size:11.5px;color:var(--fg3);margin-top:8px;line-height:1.5}
#detail .empty{font-size:12.5px;color:var(--fg3);line-height:1.75}

/* ==================== HUD / toast ==================== */
#hud{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--fg3);
  background:rgba(255,255,255,.94);border:1px solid var(--bd);border-radius:8px;padding:4px 9px;z-index:24;
  font-variant-numeric:tabular-nums}
#hud b{color:#0f172a;font-weight:700}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;
  font-size:12.5px;padding:7px 14px;border-radius:8px;opacity:0;transition:.22s;pointer-events:none;z-index:70}
#toast.on{opacity:.94}
#busyp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);font-size:13px;color:var(--fg2);z-index:50}

/* ==================== SVG ==================== */
.nd rect{stroke-width:1.7}
.nd text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#0f172a;
  pointer-events:none;dominant-baseline:middle;text-anchor:middle}
.nd{cursor:pointer}
.nd.sel rect{stroke-width:3.4;filter:drop-shadow(0 2px 6px rgba(29,78,216,.28))}
.nd.root rect{fill:#12307a}
.nd.root text{fill:#ffffff;font-weight:700}
.nd.pulse rect{stroke:#f59e0b;stroke-width:3.4}
.eg{stroke:#cbd5e1;stroke-width:1.5}
.eg.chain{stroke:#93b4f5;stroke-width:2}
.chip rect{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:4 3}
.chip text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;fill:#475569;
  pointer-events:none;dominant-baseline:middle;text-anchor:middle}
.chip{cursor:pointer}
.chip:hover rect{fill:#eff6ff;stroke:#93b4f5}
.newnd{animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">类型本体树浏览器<span class="sub">跑出来的树，当场看</span></div>
    <div class="group" id="domgrp">
      <span class="glab">语料</span>
      <button data-dom="arxiv">arXiv</button>
      <button data-dom="cfr">CFR（美国）</button>
      <button data-dom="me">MultiEURLEX（欧盟）</button>
    </div>
    <div class="group" id="famgrp">
      <span class="glab">树</span>
      <button data-fam="deep">深树（交付物）</button>
      <button data-fam="final">三层中间件（对照）</button>
    </div>
    <div id="searchwrap">
      <input id="q" placeholder="搜类型名，如 algorithm / metric" autocomplete="off">
      <div id="results" class="hidden"></div>
    </div>
  </header>

  <div id="toolrow">
    <button id="b-chain">展开最深链</button>
    <button id="b-all">再展开一层</button>
    <button id="b-collapse">全部收拢</button>
    <button id="b-fit">适配窗口</button>
    <span class="group zoomgroup">
      <button id="b-zo">−</button><span class="zl" id="zl">100%</span><button id="b-zi">+</button>
    </span>
    <span class="hint" id="hint"></span>
  </div>

  <main id="stage">
    <svg id="tree"></svg>
    <div id="levels"></div>
    <aside id="detail"></aside>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="busyp">正在载入数据…</div>
  </main>
</div>

<script>
"use strict";
/* =====================================================================
   类型本体树浏览器
   · 白底、自上而下（根在上，往下散开）
   · 初始收拢成"最深链 + 每层两个兄弟"，点节点即展开/收拢
   · 每层一条横线 + 左标签（本层总数 / 已显示数）→ 深度一眼可见
   数据：data/<dom>_<fam>.js → window.TREES[key] = {nodes, parent, stats}
   ===================================================================== */
var KEYS = {
  arxiv:{ label:'arXiv',                deep:'arxiv_deep', final:'arxiv_final', n:34530, n2:31927, d:9 },
  cfr:  { label:'CFR（美国联邦法规）',   deep:'cfr_deep',   final:'cfr_final',   n:2840,  n2:2737,  d:6 },
  me:   { label:'MultiEURLEX（欧盟法规）', deep:'me_deep',  final:'me_final',    n:40545, n2:39317, d:10 }
};
var FAMLABEL = { deep:'深树（交付物）', final:'三层中间件（对照）' };
var LEVEL_COLORS = ['#1d4ed8','#7c3aed','#0891b2','#059669','#ca8a04','#db2777','#2563eb','#9333ea','#0d9488','#ea580c','#be123c'];
var NODE_H = 30, LEVEL_H = 78, HGAP = 16, CHIP_W = 74, PAGE = 12, CHAIN_KIDS = 1;
var MIN_K = 0.03, MAX_K = 2.5, CAP_VISIBLE = 5000;
var ERRORS = [];
var NS = 'http://www.w3.org/2000/svg';

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function noteError(t){ ERRORS.push(t); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }

var state = {
  dom:'arxiv', fam:'deep', key:'arxiv_deep',
  shown:new Map(), sel:-1, k:1, tx:0, ty:0,
  items:[], byV:new Map(), W:0, H:0
};

/* ===================== 1. 载入 ===================== */
function loadTree(key, cb, fail){
  if (window.TREES && window.TREES[key]) { cb(window.TREES[key]); return; }
  var sc = document.createElement('script');
  sc.src = 'data/' + key + '.js';
  sc.onload = function(){
    if (window.TREES && window.TREES[key]) cb(window.TREES[key]);
    else { noteError('数据载入后仍无 ' + key); if (fail) fail(); }
  };
  sc.onerror = function(){ noteError('数据文件加载失败 ' + key); if (fail) fail(); };
  document.head.appendChild(sc);
}

/* ===================== 2. 建模 ===================== */
var m = null;
function buildModel(raw, key){
  var names = raw.nodes, par = raw.parent, n = names.length, i, p;
  var kids = new Array(n); for (i = 0; i < n; i++) kids[i] = [];
  var root = -1;
  for (i = 0; i < n; i++){
    p = par[i];
    if (p === -1 || p === undefined || p === null){ if (root < 0) root = i; }
    else if (p >= 0 && p < n && p !== i) kids[p].push(i);
  }
  if (root < 0) root = 0;
  var depth = new Int32Array(n).fill(-1), order = [], st = [root];
  depth[root] = 0;
  while (st.length){
    var v = st.pop(); order.push(v);
    var ch = kids[v];
    for (i = 0; i < ch.length; i++) if (depth[ch[i]] < 0){ depth[ch[i]] = depth[v] + 1; st.push(ch[i]); }
  }
  var sub = new Int32Array(n);
  for (i = order.length - 1; i >= 0; i--){
    var u = order[i], s = 0, ku = kids[u];
    for (var j = 0; j < ku.length; j++) s += sub[ku[j]] + 1;
    sub[u] = s;
  }
  var maxDepth = 0, levelCount = [];
  for (i = 0; i < n; i++){
    if (depth[i] < 0) continue;
    if (depth[i] > maxDepth) maxDepth = depth[i];
    levelCount[depth[i]] = (levelCount[depth[i]] || 0) + 1;
  }
  var deepest = root;
  for (i = 0; i < n; i++) if (depth[i] > depth[deepest]) deepest = i;
  var chain = [], v = deepest;
  while (v >= 0){ chain.push(v); if (v === root) break; v = par[v]; }
  chain.reverse();
  var chainNext = new Map();
  for (i = 0; i + 1 < chain.length; i++) chainNext.set(chain[i], chain[i + 1]);
  var ordKids = new Array(n);
  for (i = 0; i < n; i++){
    var kk = kids[i].slice(), cn = chainNext.get(i);
    if (cn !== undefined){
      var others = [];
      for (var t2 = 0; t2 < kk.length; t2++) if (kk[t2] !== cn) others.push(kk[t2]);
      var half = Math.floor(others.length / 2);
      if (i === root && half < Math.min(kk.length, PAGE)){   // 根节点：主链放中间，树形好看
        kk = others.slice(0, half).concat([cn]).concat(others.slice(half));
      } else {                                              // 其余节点：主链放首位 → 只显示 1 个时露的就是主链，链不会断
        kk = [cn].concat(others);
      }
    }
    ordKids[i] = kk;
  }
  return { key:key, names:names, parent:par, kids:kids, ordKids:ordKids, root:root, n:n,
    depth:depth, sub:sub, maxDepth:maxDepth, levelCount:levelCount, chain:chain, chainNext:chainNext,
    stats:(raw.stats || {}) };
}
function shownOf(v){ return state.shown.get(v) || 0; }

/* ===================== 3. 可见树 + 布局 ===================== */
var _cv = document.createElement('canvas'), _cx = _cv.getContext('2d');
var NAMEFONT = '13px ui-monospace,Menlo,Consolas,monospace';
function textW(s){ _cx.font = NAMEFONT; return _cx.measureText(s).width; }
function nodeW(v){ return Math.max(88, Math.min(340, textW(m.names[v]) + 28)); }

function buildVisible(){
  var budget = CAP_VISIBLE, over = false;
  function rec(v, d){
    if (budget-- <= 0){ over = true; return null; }
    var it = { t:'n', v:v, d:d, kids:[], w:nodeW(v) };
    var ord = m.ordKids[v], sh = Math.min(shownOf(v), ord.length), i;
    for (i = 0; i < sh && !over; i++){ var c = rec(ord[i], d + 1); if (c) it.kids.push(c); }
    if (ord.length > sh && !over) it.kids.push({ t:'c', v:v, d:d + 1, from:sh, n:ord.length - sh, kids:[], w:CHIP_W });
    return it;
  }
  var rootIt = rec(m.root, 0);
  return { root:rootIt, over:over };
}
function layout(root){
  var cursor = 0, flat = [], pend = [], itemByV = new Map();
  (function assign(x){
    if (x.t !== 'n') return;
    var ch = x.kids, reals = [], i;
    for (i = 0; i < ch.length; i++) if (ch[i].t === 'n') reals.push(ch[i]);
    for (i = 0; i < reals.length; i++) assign(reals[i]);
    if (!reals.length){ x.x = cursor + x.w / 2; cursor += x.w + HGAP; }
    else {
      x.x = (reals[0].x + reals[reals.length - 1].x) / 2;      // 只按真实子节点居中 → 主链竖直
      cursor = Math.max(cursor, x.x + x.w / 2 + HGAP);
    }
    x.y = x.d * LEVEL_H + NODE_H / 2;
    flat.push(x); itemByV.set(x.v, x);
    for (i = 0; i < ch.length; i++) if (ch[i].t === 'c') pend.push(ch[i]);
  })(root);
  var byLevel = {};
  for (var j = 0; j < flat.length; j++){ var it = flat[j]; (byLevel[it.d] = byLevel[it.d] || []).push(it); }
  for (var k = 0; k < pend.length; k++){
    var c = pend[k], p = itemByV.get(c.v);
    if (!p) continue;
    c.d = p.d; c.y = p.y;
    var x = p.x + p.w / 2 + 8 + CHIP_W / 2, list = byLevel[c.d] || [], moved = true, guard = 0;
    while (moved && guard++ < 80){
      moved = false;
      for (var q = 0; q < list.length; q++){
        var o = list[q];
        if (Math.abs(o.x - x) < (o.w + CHIP_W) / 2 + 6){ x = o.x + (o.w + CHIP_W) / 2 + 6; moved = true; break; }
      }
    }
    c.x = x; flat.push(c);
  }
  return flat;
}

/* ===================== 4. 渲染 ===================== */
var svg = null, gWorld = null, gEdge = null, gNode = null;
var mapNode = new Map(), mapEdge = new Map(), mapChip = new Map();
function initSVG(){
  svg = $('tree');
  svg.setAttribute('xmlns', NS);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  gWorld = document.createElementNS(NS, 'g'); svg.appendChild(gWorld);
  gEdge = document.createElementNS(NS, 'g'); gWorld.appendChild(gEdge);
  gNode = document.createElementNS(NS, 'g'); gWorld.appendChild(gNode);
  mapNode.clear(); mapEdge.clear(); mapChip.clear();
}
function mkNode(x){
  var g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'nd');
  var rc = document.createElementNS(NS, 'rect');
  rc.setAttribute('rx', '7'); rc.setAttribute('height', NODE_H);
  var tx = document.createElementNS(NS, 'text');
  g.appendChild(rc); g.appendChild(tx);
  g.__rect = rc; g.__text = tx;
  g.addEventListener('click', function(ev){ ev.stopPropagation(); onNodeClick(x.v); });
  mapNode.set(x.v, g);
  return g;
}
function mkChip(x){
  var g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'chip');
  var rc = document.createElementNS(NS, 'rect');
  rc.setAttribute('rx', '9'); rc.setAttribute('height', 22);
  var tx = document.createElementNS(NS, 'text');
  g.appendChild(rc); g.appendChild(tx);
  g.__rect = rc; g.__text = tx;
  g.addEventListener('click', function(ev){ ev.stopPropagation(); onChipClick(x); });
  mapChip.set(x.v + ':' + x.from, g);
  return g;
}
function render(){
  if (!m) return;
  var vis = buildVisible();
  state.items = layout(vis.root);
  state.byV = new Map();
  var i, x;
  for (i = 0; i < state.items.length; i++){ x = state.items[i]; if (x.t === 'n') state.byV.set(x.v, x); }
  /* ---- 边 ---- */
  var keepE = new Set();
  for (i = 0; i < state.items.length; i++){
    x = state.items[i];
    if (x === vis.root) continue;
    if (x.t === 'c') continue;                         // +N 徽标不画连线（贴在本节点旁）
    var pv = m.parent[x.v];
    var pk = 'e:n' + x.v;
    var pit = state.byV.get(pv);
    if (!pit) continue;
    keepE.add(pk);
    var ln = mapEdge.get(pk);
    if (!ln){
      ln = document.createElementNS(NS, 'line');
      ln.setAttribute('class', 'eg' + (x.t === 'n' && m.chainNext.get(pv) === x.v ? ' chain' : ''));
      gEdge.appendChild(ln); mapEdge.set(pk, ln);
    }
    ln.setAttribute('x1', pit.x.toFixed(1)); ln.setAttribute('y1', (pit.d * LEVEL_H + NODE_H).toFixed(1));
    ln.setAttribute('x2', x.x.toFixed(1)); ln.setAttribute('y2', (x.d * LEVEL_H - (x.t === 'c' ? 11 : 0)).toFixed(1));
  }
  mapEdge.forEach(function(el, k){ if (!keepE.has(k)){ el.remove(); mapEdge.delete(k); } });
  /* ---- 节点 ---- */
  var keepN = new Set();
  for (i = 0; i < state.items.length; i++){
    x = state.items[i];
    if (x.t !== 'n') continue;
    keepN.add(x.v);
    var g = mapNode.get(x.v), isNew = false;
    if (!g){ g = mkNode(x); isNew = true; }
    var col = LEVEL_COLORS[x.d % LEVEL_COLORS.length];
    var isRoot = (x.v === m.root), isSel = (state.sel === x.v);
    g.setAttribute('class', 'nd' + (isRoot ? ' root' : '') + (isSel ? ' sel' : ''));
    g.__rect.setAttribute('fill', isRoot ? '#12307a' : (isSel ? '#eff6ff' : '#ffffff'));
    g.__rect.setAttribute('stroke', isRoot ? '#12307a' : col);
    g.__rect.setAttribute('x', (x.x - x.w / 2).toFixed(1));
    g.__rect.setAttribute('y', (x.d * LEVEL_H).toFixed(1));
    g.__rect.setAttribute('width', x.w.toFixed(1));
    var inner = x.w - 16, tw = textW(m.names[x.v]);
    if (tw > inner){ g.__text.setAttribute('textLength', inner.toFixed(1)); g.__text.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
    else { g.__text.removeAttribute('textLength'); g.__text.removeAttribute('lengthAdjust'); }
    g.__text.setAttribute('x', x.x.toFixed(1));
    g.__text.setAttribute('y', (x.d * LEVEL_H + NODE_H / 2 + 1).toFixed(1));
    g.__text.textContent = m.names[x.v];
    if (isNew){ g.classList.add('newnd'); gNode.appendChild(g); }
  }
  mapNode.forEach(function(el, v){ if (!keepN.has(v)){ el.remove(); mapNode.delete(v); } });
  /* ---- +N chip ---- */
  var keepC = new Set();
  for (i = 0; i < state.items.length; i++){
    x = state.items[i];
    if (x.t !== 'c') continue;
    var ck = x.v + ':' + x.from; keepC.add(ck);
    var cg = mapChip.get(ck), isNewC = false;
    if (!cg){ cg = mkChip(x); isNewC = true; }
    cg.__rect.setAttribute('x', (x.x - CHIP_W / 2).toFixed(1));
    cg.__rect.setAttribute('y', (x.y - 11).toFixed(1));
    cg.__rect.setAttribute('width', CHIP_W);
    cg.__text.setAttribute('x', x.x.toFixed(1));
    cg.__text.setAttribute('y', (x.y + 1).toFixed(1));
    cg.__text.textContent = '+' + x.n;
    if (isNewC){ cg.classList.add('newnd'); gNode.appendChild(cg); }
  }
  mapChip.forEach(function(el, k){ if (!keepC.has(k)){ el.remove(); mapChip.delete(k); } });
  if (vis.over) toast('内容太多已截断，请逐层展开');
  drawLevels(); drawHUD(); applyView();
}
function bbox(){
  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (var i = 0; i < state.items.length; i++){
    var x = state.items[i], h = (x.t === 'n' ? NODE_H : 0);
    x0 = Math.min(x0, x.x - x.w / 2); x1 = Math.max(x1, x.x + x.w / 2);
    y0 = Math.min(y0, x.d * LEVEL_H); y1 = Math.max(y1, x.d * LEVEL_H + h);
  }
  return { x0:x0, x1:x1, y0:y0, y1:y1, w:Math.max(1, x1 - x0), h:Math.max(1, y1 - y0) };
}

/* ===================== 5. 视口 ===================== */
function applyView(){
  gWorld.setAttribute('transform', 'translate(' + state.tx.toFixed(1) + ',' + state.ty.toFixed(1) + ') scale(' + state.k.toFixed(4) + ')');
  $('zl').textContent = Math.round(state.k * 100) + '%';
  updateLevelsPos();
}
function clampK(k){ return Math.max(MIN_K, Math.min(MAX_K, k)); }
function fit(){
  if (!state.items.length) return;
  var b = bbox();
  var W = $('stage').clientWidth, H = $('stage').clientHeight;
  var padL = 170, padR = 44, padT = 40, padB = 26;
  state.k = clampK(Math.min((W - padL - padR) / b.w, (H - padT - padB) / b.h));
  state.tx = padL + (W - padL - padR) / 2 - ((b.x0 + b.x1) / 2) * state.k;
  state.ty = padT - b.y0 * state.k;
  applyView();
}
function viewOn(v){          // 展开后：尽量让"刚展开的那一排"整排可见；不够就缩小到刚好放得下（不低于 0.5）
  var it = state.byV.get(v); if (!it) return;
  var x0 = it.x - it.w / 2, x1 = it.x + it.w / 2, i, x;
  var dk = it.d + 1;
  for (i = 0; i < state.items.length; i++){
    x = state.items[i];
    if (x.t === 'n' && x.d === dk && m.parent[x.v] === v){ x0 = Math.min(x0, x.x - x.w / 2); x1 = Math.max(x1, x.x + x.w / 2); }
    else if (x.t === 'c' && x.v === v){ x0 = Math.min(x0, x.x - x.w / 2); x1 = Math.max(x1, x.x + x.w / 2); }
  }
  var W = $('stage').clientWidth, avail = W - 36;
  var kFit = clampK(avail / Math.max(180, x1 - x0));
  state.k = clampK(Math.min(state.k, Math.max(0.5, kFit)));
  state.tx = W / 2 - ((x0 + x1) / 2) * state.k;
  state.ty = $('stage').clientHeight * 0.24 - it.y * state.k;
  applyView();
}
function ensureVisible(){
  var b = bbox(), W = $('stage').clientWidth, H = $('stage').clientHeight;
  if (b.w * state.k > W * 0.99 || b.h * state.k > H * 0.99) fit();
}
function zoomStep(f){
  var W = $('stage').clientWidth, H = $('stage').clientHeight;
  var k2 = clampK(state.k * f);
  state.tx = W / 2 - (W / 2 - state.tx) * (k2 / state.k);
  state.ty = H / 2 - (H / 2 - state.ty) * (k2 / state.k);
  state.k = k2; applyView();
}
function zoomAt(px, py, k2){
  k2 = clampK(k2);
  state.tx = px - (px - state.tx) * (k2 / state.k);
  state.ty = py - (py - state.ty) * (k2 / state.k);
  state.k = k2; applyView();
}
function centerOn(v, minK){
  var it = state.byV.get(v);

  if (minK && state.k < minK) state.k = clampK(minK);
  state.tx = $('stage').clientWidth / 2 - it.x * state.k;
  state.ty = $('stage').clientHeight * 0.45 - it.y * state.k;
  applyView();
}

/* ===================== 6. 层级标尺 / HUD ===================== */
var levelRows = [];
function drawLevels(){

    levelRows[i].lab.style.display = on ? 'block' : 'none';

  }

}
function updateLevelsPos(){
  if (!m) return;
  var H = $('stage').clientHeight;
  for (var i = 0; i < m.maxDepth + 1 && i < levelRows.length; i++){
    var y = state.ty + i * LEVEL_H * state.k;
    var show = (y > -34 && y < H + 34);
    levelRows[i].ln.style.top = y.toFixed(1) + 'px';
    levelRows[i].lab.style.top = (y + 4).toFixed(1) + 'px';

function drawHUD(){

  }

    ' ｜ 类型节点 <b>' + fmt(m.n) + '</b> · 最大深度 <b>' + m.maxDepth + ' 跳</b>' +
    ' ｜ 已展开 <b>' + fmt(nv) + '</b> 个，另有 <b>' + fmt(hidden) + '</b> 个收在 +N 里';

/* ===================== 7. 交互 ===================== */
function toast(msg){

  clearTimeout(t.__t); t.__t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
function onNodeClick(v){
  var ord = m.ordKids[v];
  if (!ord.length){ select(v); showDetail(v); return; }
  var was = shownOf(v);
  if (was > 0) state.shown.set(v, 0);
  else state.shown.set(v, Math.min(ord.length, PAGE));
  select(v); render(); showDetail(v);
  if (shownOf(v) > 0) viewOn(v);
}
function onChipClick(x){
  var ord = m.ordKids[x.v], cur = shownOf(x.v);
  var nx = Math.min(ord.length, Math.max(cur + PAGE, x.from + PAGE));
  if (nx === cur) return;
  state.shown.set(x.v, nx);
  render(); viewOn(x.v);
}
function expandTo(v, count){ state.shown.set(v, Math.min(m.ordKids[v].length, count)); }
function toggle(v){
  var ord = m.ordKids[v]; if (!ord.length) return;
  state.shown.set(v, shownOf(v) > 0 ? 0 : Math.min(ord.length, PAGE));
  render();
}
function chainExpand(){
  state.shown.clear();
  for (var i = 0; i < m.chain.length; i++){
    var v = m.chain[i], ord = m.ordKids[v];
    if (ord.length) state.shown.set(v, Math.min(ord.length, i === 0 ? PAGE : CHAIN_KIDS));
  }
  state.sel = -1; $('detail').innerHTML = emptyDetail();
  render(); fit();
}
function collapseAll(){
  state.shown.clear();
  if (m.ordKids[m.root].length) state.shown.set(m.root, Math.min(m.ordKids[m.root].length, PAGE));
  state.sel = -1; select(-1); $('detail').innerHTML = emptyDetail();
  render(); fit();
}
function expandOneMore(){
  var list = state.items.slice(), grew = 0, hadHidden = false;
  for (var i = 0; i < list.length; i++){
    var x = list[i];
    if (x.t !== 'n') continue;
    var ord = m.ordKids[x.v], sh = shownOf(x.v);
    if (sh < ord.length){ hadHidden = true; state.shown.set(x.v, Math.min(ord.length, sh + PAGE)); grew++; }
  }
  if (!grew){ toast('已经全展开了'); return false; }
  render();
  return true;
}
function select(v){
  state.sel = v;
  mapNode.forEach(function(g, k){
    var isRoot = (k === m.root), isSel = (k === v);
    g.classList.toggle('sel', isSel);
    g.__rect.setAttribute('fill', isRoot ? '#12307a' : (isSel ? '#eff6ff' : '#ffffff'));
    g.__rect.setAttribute('stroke', isRoot ? '#12307a' : LEVEL_COLORS[m.depth[k] % LEVEL_COLORS.length]);
  });
}
function emptyDetail(){

    '并在下面直接展开或收拢它。<br><br>左栏每一行是一层，写着<b>本层共多少个 / 已显示多少个</b> —— ' +
    '往右端能看到第 9 层（arXiv）、第 10 层（欧盟）就说明这棵树确实是深的。</div>';
}
function showDetail(v){

  while (u >= 0){ path.push(u); if (u === m.root) break; u = m.parent[u]; }
  path.reverse();

  }

      (kidsN ? '（当前显示 <span class="kv">' + fmt(Math.min(sh, kidsN)) + '</span> 个）' : '') + '</div>' +
    '<div class="row">全部后代：<span class="kv">' + fmt(m.sub[v]) + '</span> 个</div>' +

}
function revealTo(v){
  var path = [], u = v;
  while (u >= 0){ path.push(u); if (u === m.root) break; u = m.parent[u]; }
  path.reverse();
  for (var i = 0; i + 1 < path.length; i++){

}
function findByName(q){

}

/* ===================== 8. 指针 / 键盘 ===================== */
function initPointer(){
  var drag = false, lx = 0, ly = 0, moved = 0;
  svg.addEventListener('pointerdown', function(ev){
    if (ev.button !== 0) return;
    drag = true; moved = 0; lx = ev.clientX; ly = ev.clientY;
    svg.classList.add('drag');
    try { svg.setPointerCapture(ev.pointerId); } catch(e){}
  });
  svg.addEventListener('pointermove', function(ev){
    if (!drag) return;
    var dx = ev.clientX - lx, dy = ev.clientY - ly;
    lx = ev.clientX; ly = ev.clientY; moved += Math.abs(dx) + Math.abs(dy);
    state.tx += dx; state.ty += dy; applyView();
  });
  svg.addEventListener('pointerup', function(ev){
    drag = false; svg.classList.remove('drag');
    try { svg.releasePointerCapture(ev.pointerId); } catch(e){}
  });
  svg.addEventListener('click', function(ev){
    if (moved > 5) return;
    if (ev.target === svg){ state.sel = -1; select(-1); $('detail').innerHTML = emptyDetail(); }
  });
  svg.addEventListener('wheel', function(ev){
    ev.preventDefault();
    var r = $('stage').getBoundingClientRect();
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, state.k * Math.pow(1.0016, -ev.deltaY));
  }, { passive:false });
  window.addEventListener('keydown', function(ev){
    if (ev.target.tagName === 'INPUT') return;
    if (ev.key === '+' || ev.key === '=') zoomStep(1.18);
    else if (ev.key === '-' || ev.key === '_') zoomStep(1 / 1.18);
    else if (ev.key === '0') fit();
  });
  window.addEventListener('resize', function(){ drawLevels(); });
}

/* ===================== 9. 挂载 / 切换 ===================== */
function mount(key, cb){
  loadTree(key, function(raw){
    m = buildModel(raw, key);
    state.key = key; state.sel = -1; state.shown.clear();
    initSVG();
    $('detail').innerHTML = emptyDetail();
    chainExpand();
    syncBtns();
    $('busyp').classList.add('hidden');
    if (cb) cb();
  }, function(){
    $('busyp').textContent = '数据加载失败：' + key + '（请确认 data/ 目录完整）';
  });
}
function syncBtns(){
  document.querySelectorAll('#domgrp button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-dom') === state.dom); });
  document.querySelectorAll('#famgrp button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-fam') === state.fam); });
  $('hint').innerHTML = '点节点＝展开/收拢 · 拖拽平移 · 滚轮缩放 · 点虚线框 <b>+N</b> 显示更多子节点';
}
function switchTree(dom, fam){

/* ===================== 10. 自测 ===================== */
function countVis(){ var n = 0; for (var i = 0; i < state.items.length; i++) if (state.items[i].t === 'n') n++; return n; }
function selftest(done){
  var out = { checks:[], errors:[], ok:true };
  function ck(name, cond, info){ out.checks.push({ name:name, pass:!!cond, info:(info === undefined ? null : info) }); if (!cond) out.ok = false; }
  var bg = (getComputedStyle(document.body).backgroundColor.match(/\d+/g) || [0,0,0]).map(Number);
  var lum = (0.2126 * bg[0] + 0.7152 * bg[1] + 0.0722 * bg[2]) / 255;
  ck('白底主题（body 亮度 > 0.8）', lum > 0.8, { bg:bg, lum:Math.round(lum * 1000) / 1000 });
  var order = [['arxiv','deep'],['cfr','deep'],['me','deep'],['arxiv','final'],['cfr','final'],['me','final']], oi = 0;
  function next(){
    if (oi >= order.length){
      out.errors = ERRORS.slice(0, 6);
      if (ERRORS.length) out.ok = false;
      done(out); return;
    }
    var s = order[oi++], tag = s[0] + '/' + s[1];
    var dEl = document.querySelector('#domgrp button[data-dom="' + s[0] + '"]');
    var fEl = document.querySelector('#famgrp button[data-fam="' + s[1] + '"]');
    ck(tag + ' 按钮存在', !!(dEl && fEl));
    state.dom = s[0]; state.fam = s[1]; syncBtns();
    mount(KEYS[s[0]][s[1]], function(){
      var expD = (s[1] === 'deep' ? KEYS[s[0]].d : 3);
      var wantN = (s[1] === 'deep' ? KEYS[s[0]].n : KEYS[s[0]].n2);
      ck(tag + ' 节点数', m.n === wantN, { got:m.n, want:wantN });
      ck(tag + ' 最大深度 ' + expD + ' 跳', m.maxDepth === expD, { got:m.maxDepth });
      var v0 = countVis();
      ck(tag + ' 初始是收拢的', v0 <= 60, { visible:v0 });
      var nChips = 0;
      for (i = 0; i < state.items.length; i++) if (state.items[i].t === 'c') nChips++;
      ck(tag + ' 收拢内容有 +N 徽标提示', nChips > 0, { chips:nChips });
      // 层级标尺
      ck(tag + ' 标尺 ' + (m.maxDepth + 1) + ' 行', levelRows.length >= m.maxDepth + 1, { rows:levelRows.length });
      ck(tag + ' 标尺最后一层有计数', /显示/.test(levelRows[m.maxDepth].lab.innerHTML), { txt:levelRows[m.maxDepth].lab.innerHTML.slice(0, 40) });
      ck(tag + ' 标尺 y 随深度递增', parseFloat(levelRows[1].ln.style.top) > parseFloat(levelRows[0].ln.style.top));
      ck(tag + ' 标尺多余行已隐藏', levelRows.length <= m.maxDepth + 1 || levelRows[m.maxDepth + 1].ln.style.display === 'none',
        { rows:levelRows.length, need:m.maxDepth + 1 });
      // 最深节点可展开到最深
      state.shown.clear();
      for (var i = 0; i < m.chain.length; i++){ var cv = m.chain[i]; if (m.ordKids[cv].length) state.shown.set(cv, Math.min(m.ordKids[cv].length, PAGE)); }
      render();
      var deepV = m.chain[m.chain.length - 1], found = state.byV.get(deepV);
      ck(tag + ' 最深节点可见且在第 ' + (m.maxDepth + 1) + ' 层', !!found && found.d === m.maxDepth,
        { visible:!!found, d:(found ? found.d : -1) });
      // 点节点展开 → 可见数增加；再点同一节点 → 收拢
      collapseAll();
      var target = null;
      for (i = 0; i < state.items.length; i++){
        var x = state.items[i];
        if (x.t === 'n' && shownOf(x.v) === 0 && m.ordKids[x.v].length > 0){ target = x.v; break; }
      }
      var b1 = countVis();
      if (target !== null) onNodeClick(target);
      var b2 = countVis();
      ck(tag + ' 点收拢的节点可展开（可见数增加）', target !== null && b2 > b1,
        { node:(target === null ? null : m.names[target]), before:b1, after:b2 });
      if (target !== null) onNodeClick(target);
      ck(tag + ' 再点一次可收拢（可见数回落）', countVis() < b2, { after:countVis() });
      // 再展开一层按钮
      var hadHidden = false;
      for (i = 0; i < state.items.length; i++){
        x = state.items[i];
        if (x.t === 'n' && shownOf(x.v) < m.ordKids[x.v].length) hadHidden = true;
      }
      var b3 = countVis(), grew = expandOneMore(), b4 = countVis();
      ck(tag + ' 再展开一层', (!hadHidden) || (grew && b4 > b3), { hadHidden:hadHidden, grew:grew, before:b3, after:b4 });
      collapseAll();
      ck(tag + ' 全部收拢后只剩根与第一层', countVis() <= 40, { visible:countVis() });
      // 搜索定位
      var probe = null;
      for (i = 0; i < state.items.length; i++){ if (state.items[i].t === 'n' && m.names[state.items[i].v].length >= 8){ probe = m.names[state.items[i].v].slice(0, 8); break; } }
      var res = findByName(probe || 'a');
      ck(tag + ' 搜索「' + probe + '」有命中', res.length > 0, { hits:res.length, algorithmHits:findByName('algorithm').length });
      if (res.length){
        goTo(res[0].v);
        var it2 = state.byV.get(res[0].v);
        ck(tag + ' 搜索结果定位成功', state.sel === res[0].v && !!it2, { sel:state.sel, visible:!!it2, zoom:Math.round(state.k * 100) + '%' });
      }
      // 缩放边界
      zoomAt(200, 200, 99); var hi = state.k; zoomAt(200, 200, 0.0001); var lo = state.k;
      ck(tag + ' 缩放钳制在 ' + MIN_K + '–' + MAX_K, hi <= MAX_K + 1e-6 && lo >= MIN_K - 1e-6, { hi:hi, lo:lo });
      fit();
      next();
    });
  }
  next();
}

/* ===================== 11. 启动 ===================== */
function bindUI(){
  document.querySelectorAll('#domgrp button').forEach(function(b){
    b.addEventListener('click', function(){ switchTree(b.getAttribute('data-dom'), state.fam); });
  });
  document.querySelectorAll('#famgrp button').forEach(function(b){
    b.addEventListener('click', function(){ switchTree(state.dom, b.getAttribute('data-fam')); });
  });
  $('b-chain').addEventListener('click', chainExpand);
  $('b-all').addEventListener('click', function(){ expandOneMore(); });
  $('b-collapse').addEventListener('click', collapseAll);
  $('b-fit').addEventListener('click', fit);
  $('b-zi').addEventListener('click', function(){ zoomStep(1.18); });
  $('b-zo').addEventListener('click', function(){ zoomStep(1 / 1.18); });
  var qt = null;
  $('q').addEventListener('input', function(){
    clearTimeout(qt);
    qt = setTimeout(function(){ showResults(findByName($('q').value), $('q').value.trim()); }, 130);
  });
  $('q').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){
      var res = findByName($('q').value);
      if (res.length){ $('results').classList.add('hidden'); goTo(res[0].v); }
    }
    if (ev.key === 'Escape') $('results').classList.add('hidden');
  });
  document.addEventListener('click', function(ev){
    if (!ev.target.closest('#searchwrap')) $('results').classList.add('hidden');
  });
}
function expose(){
  window.__tree = {
    state:state,
    model:function(){ return m; },
    visibleCount:countVis,
    levels:function(){ return levelRows.map(function(r){ return r.lab.innerHTML.replace(/<[^>]+>/g, ''); }); },
    mount:mount, switchTree:switchTree,
    expand:function(v){ expandTo(v, PAGE); render(); },
    toggle:toggle, chainExpand:chainExpand, expandOneMore:expandOneMore, collapseAll:collapseAll,
    collapse:function(v){ state.shown.set(v, 0); render(); },
    reveal:function(name){ var r = findByName(name); if (r.length){ goTo(r[0].v); return r[0].v; } return -1; },
    search:findByName, goTo:goTo, fit:fit, zoom:function(k){ state.k = clampK(k); applyView(); },
    bg:function(){ return getComputedStyle(document.body).backgroundColor; },
    errors:function(){ return ERRORS.slice(); },
    selftest:selftest
  };
}
function boot(){
  expose(); initSVG(); initPointer(); bindUI();
  var want = location.hash.match(/#(\w+)_(deep|final)\b/);
  if (want){ state.dom = want[1]; state.fam = want[2]; }
  syncBtns();
  switchTree(state.dom, state.fam);
  if (location.hash.indexOf('selftest') >= 0){
    setTimeout(function(){
      selftest(function(out){
        var pre = document.createElement('pre');
        pre.id = 'selftest-out';
        pre.textContent = 'SELFTEST_JSON_BEGIN' + JSON.stringify(out) + 'SELFTEST_JSON_END';
        document.body.appendChild(pre);
      });
    }, 800);
  }
}
window.addEventListener('error', function(e){ noteError('JS: ' + (e.message || 'unknown')); });
boot();
</script>
